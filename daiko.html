<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大航海ゲーム — W杯2026 豆知識図鑑</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse at 50% 80%, #001830 0%, #000c20 50%, #000 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Stars */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at  8% 12%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 18%  5%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 32% 18%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 47%  8%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 62% 14%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.5px 1.5px at 76%  6%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 88% 20%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 12% 30%, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 92%  9%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 24% 40%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 70% 32%, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 38% 35%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at  4% 48%, rgba(255,255,255,0.2), transparent),
        radial-gradient(1px 1px at 82% 42%, rgba(255,255,255,0.5), transparent);
    }

    /* Back button */
    .back-btn {
      position: fixed; top: 20px; left: 24px; z-index: 100;
      font-size: 11px; font-weight: 700; color: #3a6080; text-decoration: none;
      padding: 5px 14px; border: 1px solid rgba(80,140,200,0.25); border-radius: 4px;
      letter-spacing: 0.08em; transition: color 0.15s, border-color 0.15s;
    }
    .back-btn:hover { color: #7ab0e0; border-color: rgba(80,140,200,0.6); }

    /* Ship SVG background */
    .bg-ship {
      position: fixed; bottom: 0; left: 0; right: 0; width: 100%; z-index: 0;
      pointer-events: none; opacity: 0.18;
      animation: shipRock 9s ease-in-out infinite;
      transform-origin: 50% 88%;
    }
    @keyframes shipRock {
      0%, 100% { transform: rotate(-0.6deg) translateY(0); }
      50%       { transform: rotate(0.6deg) translateY(-6px); }
    }

    /* Main stage */
    .stage {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 80px 24px 60px;
      text-align: center;
    }

    .compass {
      font-size: 38px; opacity: 0.65;
      animation: compassSpin 12s linear infinite;
    }
    @keyframes compassSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .ship-emoji {
      font-size: 88px; margin: 4px 0;
      animation: sailSway 3.5s ease-in-out infinite alternate;
    }
    @keyframes sailSway {
      0%   { transform: translateX(-20px) rotate(-5deg); }
      100% { transform: translateX(20px) rotate(5deg); }
    }

    .waves {
      font-size: 26px; letter-spacing: 10px; opacity: 0.45;
      animation: waveShift 2.6s ease-in-out infinite;
    }
    @keyframes waveShift { 0%, 100% { transform: translateX(-12px); } 50% { transform: translateX(12px); } }

    .title {
      font-size: clamp(32px, 7vw, 52px); font-weight: 900;
      letter-spacing: 0.08em; margin-top: 10px;
      color: #7ac8ff;
      text-shadow: 0 0 30px rgba(100,200,255,0.9), 0 0 80px rgba(50,160,255,0.45);
    }

    .eyebrow {
      font-size: 11px; font-weight: 700; color: #2a5570;
      letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 4px;
    }

    .sub {
      font-size: 14px; color: #2e6080; letter-spacing: 0.12em; margin-top: 4px;
    }

    .divider {
      width: 200px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(80,160,220,0.3), transparent);
      margin: 18px 0;
    }

    .desc-card {
      max-width: 480px;
      background: rgba(0,80,140,0.07);
      border: 1px solid rgba(80,140,200,0.15); border-radius: 12px;
      padding: 22px 28px; font-size: 14px; color: #2e5878; line-height: 1.9;
    }
    .desc-card b { color: #4a9ac8; }

    .rules {
      max-width: 420px; margin-top: 6px;
      display: flex; flex-direction: column; gap: 10px; text-align: left;
    }
    .rule {
      display: flex; align-items: flex-start; gap: 14px;
      background: rgba(0,60,120,0.08); border: 1px solid rgba(60,120,180,0.12);
      border-radius: 8px; padding: 12px 16px;
    }
    .rule-icon { font-size: 22px; flex-shrink: 0; }
    .rule-body { font-size: 13px; color: #2a5070; line-height: 1.7; }
    .rule-body b { color: #4a8ab0; }

    .coming {
      margin-top: 28px;
      font-size: 13px; color: #1e3d54; letter-spacing: 0.22em;
      border-top: 1px solid rgba(60,120,180,0.12); padding-top: 22px;
    }
    .coming span { color: #2a6080; }

    @media (max-width: 480px) {
      .desc-card { padding: 16px 18px; font-size: 13px; }
      .back-btn { font-size: 10px; padding: 4px 10px; }
    }
  </style>
</head>
