<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 675px; overflow: hidden;
    background: linear-gradient(135deg, #0f1923 0%, #1a2a3a 100%);
    font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    color: #fff; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 28px;
  }
  .header {
    font-size: 15px; color: #8899aa; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .teams {
    display: flex; align-items: center; gap: 48px;
  }
  .team {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .team-flag { font-size: 52px; }
  .team-name { font-size: 22px; font-weight: 700; letter-spacing: 0.05em; }
  .team-year { font-size: 13px; color: #8899aa; }
  .vs { color: #00d4ff; font-size: 32px; font-weight: 700; }
  .stats { width: 860px; }
  .stat-row {
    display: grid; grid-template-columns: 1fr 180px 1fr;
    align-items: center; gap: 16px;
    padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .stat-row:last-child { border-bottom: none; }
  .val { font-size: 26px; font-weight: 700; }
  .val.left { text-align: right; color: #fff; }
  .val.right { text-align: left; color: #aabbcc; }
  .label { text-align: center; font-size: 13px; color: #8899aa; white-space: nowrap; }
  .highlight { color: #00d4ff; }
  .caption {
    font-size: 19px; color: #00d4ff; font-weight: 600; letter-spacing: 0.06em;
    border-top: 1px solid rgba(0,212,255,0.3); padding-top: 20px; width: 860px; text-align: center;
  }
</style>
</head>
<body>
  <div class="header">FIFA World Cup 2026 — History's Smallest Nations</div>

  <div class="teams">
    <div class="team">
      <span class="team-flag">🏝️</span>
      <span class="team-name highlight">キュラソー</span>
      <span class="team-year">2026年 — 新記録</span>
    </div>
    <span class="vs">VS</span>
    <div class="team">
      <span class="team-flag">🇮🇸</span>
      <span class="team-name">アイスランド</span>
      <span class="team-year">2018年 — 旧記録</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <span class="val left highlight">156,000人</span>
      <span class="label">人　口</span>
      <span class="val right">350,000人</span>
    </div>
    <div class="stat-row">
      <span class="val left highlight">443 km²</span>
      <span class="label">国土面積</span>
      <span class="val right">103,000 km²</span>
    </div>
    <div class="stat-row">
      <span class="val left highlight">7勝3分0敗</span>
      <span class="label">予選成績</span>
      <span class="val right">—</span>
    </div>
    <div class="stat-row">
      <span class="val left highlight">✓ ギネス認定</span>
      <span class="label">W杯最小国</span>
      <span class="val right">✓ 旧ギネス</span>
    </div>
  </div>

  <div class="caption">W杯史上最小国 記録を塗り替えた — 人口16万人の奇跡</div>
</body>
</html>
