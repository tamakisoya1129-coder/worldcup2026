<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Stats Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 675px; overflow: hidden;
    background: linear-gradient(135deg, #0f1923 0%, #1a2a3a 100%);
    font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    color: #fff; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 24px;
  }
  .header { font-size: 15px; color: #8899aa; letter-spacing: 0.08em; }
  .teams {
    display: flex; align-items: center; gap: 44px; font-size: 32px; font-weight: 700;
  }
  .team-block { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .team-label { font-size: 13px; color: #8899aa; font-weight: 400; }
  .divider { font-size: 28px; color: #00d4ff; font-weight: 900; }
  .stats { width: 860px; }
  .stat-row {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 16px;
    padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .stat-row:last-child { border-bottom: none; }
  .val { font-size: 30px; font-weight: 700; }
  .val.left  { text-align: right; }
  .val.right { text-align: left; }
  .val.gold  { color: #ffd700; }
  .val.dim   { color: #556677; }
  .val.red   { color: #ff5555; }
  .label { text-align: center; font-size: 13px; color: #8899aa; white-space: nowrap; }
  .caption {
    font-size: 20px; color: #00d4ff; font-weight: 700; letter-spacing: 0.04em;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">FIFA WORLD CUP 2026 · GROUP A · JUNE 12 · ESTADIO AZTECA</div>

  <div class="teams">
    <div class="team-block">
      <span style="font-size:36px;">🇲🇽 メキシコ</span>
      <span class="team-label">2026年 開幕戦</span>
    </div>
    <div class="divider">VS</div>
    <div class="team-block">
      <span style="font-size:36px;">📅 過去7大会</span>
      <span class="team-label">1930〜2022年 開幕戦</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <span class="val left gold">1勝</span>
      <span class="label">勝利数</span>
      <span class="val right red">0勝</span>
    </div>
    <div class="stat-row">
      <span class="val left">0敗</span>
      <span class="label">敗北数</span>
      <span class="val right">5敗</span>
    </div>
    <div class="stat-row">
      <span class="val left">0分</span>
      <span class="label">引き分け</span>
      <span class="val right">2分</span>
    </div>
    <div class="stat-row">
      <span class="val left" style="font-size:22px;">2026年</span>
      <span class="label">初勝利までの年数</span>
      <span class="val right dim" style="font-size:20px;">96年待ち</span>
    </div>
    <div class="stat-row">
      <span class="val left" style="font-size:20px; color:#ffd700;">歴史的快挙</span>
      <span class="label">1930年W杯第1号ゴールの相手が</span>
      <span class="val right dim" style="font-size:20px;">今日も戦った</span>
    </div>
  </div>

  <div class="caption">7試合0勝の呪縛——96年後にアステカで解けた</div>
</body>
</html>
