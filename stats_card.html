<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メッシ ワールドカップ通算記録 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 675px; overflow: hidden;
    background: linear-gradient(135deg, #0f1923 0%, #1a2a3a 100%);
    font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    color: #fff; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 28px;
  }
  .teams {
    display: flex; align-items: center; gap: 24px; font-size: 32px; font-weight: 700;
  }
  .vs { color: #00d4ff; font-size: 22px; }
  .subhead {
    font-size: 14px; color: #8899aa; letter-spacing: 0.1em; margin-top: -18px;
  }
  .stats { width: 900px; }
  .stat-row {
    display: grid; grid-template-columns: 140px 1fr;
    align-items: center; gap: 20px;
    padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .stat-row:last-child { border-bottom: none; }
  .val {
    font-size: 34px; font-weight: 900; color: #00d4ff; text-align: right;
  }
  .label { font-size: 16px; color: #eef2f5; }
  .label small { display: block; font-size: 12px; color: #8899aa; margin-top: 2px; }
  .caption {
    font-size: 22px; color: #00d4ff; font-weight: 700; letter-spacing: 0.04em;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="teams">
    <span>🇦🇷 Lionel Messi</span>
    <span class="vs">FIFA WORLD CUP</span>
  </div>
  <div class="subhead">CAREER RECORDS ／ UPDATED THROUGH 2026 TOURNAMENT</div>

  <div class="stats">
    <div class="stat-row">
      <span class="val">21</span>
      <span class="label">通算得点 — 歴代単独最多<small>2位エムバペ(18)に+3。エジプト戦83分に記録更新</small></span>
    </div>
    <div class="stat-row">
      <span class="val">8</span>
      <span class="label">2026年大会得点<small>1930年ステアビレのアルゼンチン大会最多記録に並ぶ</small></span>
    </div>
    <div class="stat-row">
      <span class="val">9試合</span>
      <span class="label">連続得点 — W杯史上最長<small>自身の記録をさらに更新中</small></span>
    </div>
    <div class="stat-row">
      <span class="val">9</span>
      <span class="label">通算アシスト — 歴代単独最多<small>1966年の記録集計開始以来</small></span>
    </div>
    <div class="stat-row">
      <span class="val">14</span>
      <span class="label">決勝T通算ゴール関与（7得点7A）<small>過去60年で最多</small></span>
    </div>
  </div>

  <div class="caption">39歳、逆転勝利の立役者としてまだ記録を塗り替え続けている</div>
</body>
</html>
